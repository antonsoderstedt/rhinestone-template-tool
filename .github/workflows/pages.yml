name: Deploy to GitHub Pages

# Builds the app as a static site and publishes it at https://<user>.github.io/<repo>/.
# One-time setting: Repository > Settings > Pages > Build and deployment > Source = "GitHub Actions".

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GITHUB_PAGES: 'true'
      NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Leave out the routes a static site cannot serve
        run: node scripts/prepare-pages-build.mjs

      - name: Build static site
        run: npm run build

      - name: Do not run the site through Jekyll
        run: touch out/.nojekyll

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
